name: Keep Tibo Monitor Alive

on:
  workflow_dispatch:

  schedule:
    # 매월 1일 00:17 UTC = 한국시간 오전 9:17
    - cron: "17 0 1 * *"

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v7

      - name: Keep-alive 커밋 생성
        run: |
          echo "Last keepalive: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/keepalive.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/keepalive.txt
          git commit -m "chore: keep Tibo monitor active" || exit 0
          git push
